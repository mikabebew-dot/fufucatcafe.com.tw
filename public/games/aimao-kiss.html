<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><title>愛貓魔人想親親貓咪100次｜FUFU × NUKUNUKU 貓咪遊樂室</title><meta name="description" content="愛貓魔人想親親貓咪100次！選 Kuma、花花、石內卜、六六、藍藍香，跳躍收集罐頭的跑酷小遊戲。手機、電腦都能玩。"><link rel="icon" href="/icons/admin-64.png"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&family=Lilita+One&display=swap">
<style>
/* Layout: one full-screen canvas stage; DOM overlays (HUD, title, select, pause, game over) float above it. Single storybook look, no theme switch. */
:root{
  --ink:#2b1830;
  --cream:#fff4df;
  --gold:#ffc83d; --gold-d:#e08a12;
  --berry:#ff5d8f; --berry-d:#d63a6c;
  --mint:#3fd0a0; --mint-d:#1f9a72;
  --plum:#6b3d8f;
  --f-dis:"Lilita One","Chiron GoRound TC","Noto Sans TC",system-ui,sans-serif;
  --f-zh:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#2b1830;color:var(--ink);overflow:hidden;font-family:var(--f-zh);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:#7fd3e6}
#game{position:absolute;inset:0;display:block}

/* ---------- 3D buttons ---------- */
.btn{position:relative;overflow:hidden;font:900 clamp(19px,4.8vw,26px)/1 var(--f-zh);letter-spacing:.04em;color:#fff;
  background:linear-gradient(#ff86ad,var(--berry) 55%,#f2477c);border:4px solid var(--ink);border-radius:20px;
  padding:15px 30px 17px;cursor:pointer;touch-action:manipulation;
  box-shadow:0 7px 0 var(--ink),inset 0 -6px 0 rgba(0,0,0,.16),inset 0 4px 0 rgba(255,255,255,.5);
  text-shadow:0 3px 0 rgba(43,24,48,.35);transition:transform .07s,box-shadow .07s}
.btn::after{content:"";position:absolute;top:-20%;left:-60%;width:40%;height:140%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 2.8s ease-in-out infinite}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink),inset 0 -4px 0 rgba(0,0,0,.16),inset 0 4px 0 rgba(255,255,255,.5)}
.btn:focus-visible,.ibtn:focus-visible,.card:focus-visible{outline:4px solid #fff;outline-offset:3px}
.btn.gold{background:linear-gradient(#ffe27a,var(--gold) 55%,#ffad1f);color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.6)}
.btn.mint{background:linear-gradient(#7ff0c8,var(--mint) 55%,#25b585)}
.btn.small{font-size:clamp(16px,4vw,20px);padding:12px 20px 14px;border-radius:16px}
@keyframes shine{0%,55%{left:-60%}85%,100%{left:130%}}
.ibtn{pointer-events:auto;width:48px;height:48px;display:grid;place-items:center;border:4px solid var(--ink);border-radius:16px;cursor:pointer;
  background:linear-gradient(#fff,#ffe6b8);box-shadow:0 5px 0 var(--ink),inset 0 -4px 0 rgba(0,0,0,.1);touch-action:manipulation;transition:transform .07s,box-shadow .07s;padding:0}
.ibtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.ibtn svg{width:24px;height:24px}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 45%,rgba(43,24,48,.05),rgba(43,24,48,.5));overflow-y:auto;text-align:center}
.panel{background:var(--cream);border:5px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 var(--ink),0 22px 40px rgba(0,0,0,.3);
  padding:clamp(18px,4vw,28px);width:100%;max-width:560px;position:relative}
.panel h2{margin:0 0 12px;font:900 clamp(26px,6.4vw,38px)/1.15 var(--f-zh);color:var(--berry);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);text-wrap:balance}

.logo-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.logo{font-family:var(--f-dis);font-size:clamp(78px,20vw,150px);line-height:.85;color:var(--gold);-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;
  text-shadow:0 9px 0 var(--ink);letter-spacing:.03em;transform:rotate(-5deg);animation:wob 2.8s ease-in-out infinite}
.logo span{color:#fff}
.logo.zh{font:900 clamp(56px,15vw,112px)/1 var(--f-zh);letter-spacing:.02em}
.logo-sub b{font:400 1.35em/1 var(--f-dis);color:var(--gold);margin:0 .08em;display:inline-block;transform:rotate(-6deg) translateY(.04em)}
.logo-sub{margin-top:6px;font:900 clamp(30px,8vw,52px)/1.1 var(--f-zh);color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--berry-d),0 10px 0 var(--ink);transform:rotate(2deg)}
.tagline{margin:4px 0 0;font:700 clamp(15px,3.8vw,19px)/1.5 var(--f-zh);color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;max-width:30ch;text-wrap:balance}
@keyframes wob{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(-2deg) translateY(-6px)}}
.spark{position:absolute;width:var(--s,26px);height:var(--s,26px);background:#fff6b0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  filter:drop-shadow(0 0 6px #ffd84a);animation:tw 1.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes tw{0%,100%{transform:scale(.4) rotate(0);opacity:.4}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
.mini{font:700 14px/1.4 var(--f-zh);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}

/* select */
.seg{display:flex;justify-content:center;gap:8px;margin:-4px 0 14px}
.seg button{font:900 15px/1 var(--f-zh);padding:10px 16px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.seg button.on{background:linear-gradient(#ffe27a,var(--gold));transform:translateY(-2px)}
@media (max-width:480px){ .stats{font-size:10.5px;gap:2px 4px} .card .tag{font-size:11px} }
#select .panel{max-width:1060px}
@media (max-width:980px){ .cards{grid-template-columns:repeat(3,1fr)!important} }
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:6px 0 16px}
.card{border:4px solid var(--ink);border-radius:20px;background:#fff;padding:8px 8px 10px;box-shadow:0 6px 0 var(--ink);cursor:pointer;font-family:var(--f-zh);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;transition:transform .12s}
.card.sel{background:linear-gradient(#fffbe8,#ffe08a);transform:translateY(-6px) rotate(-1.5deg);box-shadow:0 10px 0 var(--ink),0 0 0 4px var(--gold),0 0 28px 6px rgba(255,200,61,.7)}
.card canvas{width:100%;aspect-ratio:16/13;border-radius:12px;background:radial-gradient(circle at 50% 70%,#fff7d0,#ffd6e6);border:3px solid var(--ink)}
.card .nm{font:400 clamp(20px,5vw,28px)/1 var(--f-dis);letter-spacing:.04em}
.card .tag{font:700 12px/1.3 var(--f-zh);color:var(--plum)}
.card.lock{cursor:not-allowed;background:#e8dfd2;color:#7d6f68}
.card.lock .ph{width:100%;aspect-ratio:16/13;border-radius:12px;border:3px solid var(--ink);background:#bfb2a4;display:grid;place-items:center;font:400 clamp(34px,9vw,52px)/1 var(--f-dis);color:#8a7b70}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;text-align:left;font:700 13px/1.3 var(--f-zh);width:100%;padding:0 2px}
.stats b{color:var(--gold-d);letter-spacing:1px}
.sel-desc{font:500 15px/1.6 var(--f-zh);margin:0 0 16px;text-wrap:balance}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:6px 10px;pointer-events:none;
  padding-block:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.hud-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.score{font:400 clamp(32px,6vw,48px)/1 var(--f-dis);color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);font-variant-numeric:tabular-nums}
.cans{display:flex;align-items:center;gap:6px;font:400 22px/1 var(--f-dis);color:var(--gold);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;font-variant-numeric:tabular-nums}
.cans svg{width:24px;height:26px}
.hud-c{display:flex;flex-direction:column;align-items:center;gap:6px}
.pill{font:900 15px/1 var(--f-zh);color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:99px;padding:6px 14px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.fever{position:relative;width:clamp(150px,30vw,250px);height:24px;border:4px solid var(--ink);border-radius:99px;background:rgba(255,255,255,.6);overflow:hidden;box-shadow:0 3px 0 var(--ink)}
#feverFill{position:absolute;inset:0 auto 0 0;width:0%;background:linear-gradient(90deg,var(--berry),var(--gold));transition:width .15s}
.fever b{position:absolute;inset:0;display:grid;place-items:center;font:400 14px/1 var(--f-dis);letter-spacing:.12em;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.fever.on{animation:pulse .4s ease-in-out infinite alternate}
.fever.on #feverFill{background:linear-gradient(90deg,#ff5d8f,#ffc83d,#5ee08f,#4fb6ff,#b66bff,#ff5d8f);background-size:200% 100%;animation:rb 1s linear infinite}
@keyframes rb{to{background-position:200% 0}}
#progFill{position:absolute;inset:0 auto 0 0;width:0%;background:linear-gradient(90deg,#7fd3e6,#4fb6ff);transition:width .2s}
.lvgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:6px 0 18px}
.lv{width:calc((100% - 24px)/3);max-width:160px;min-height:120px;border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;color:var(--ink);font-family:var(--f-zh);padding:10px 4px;transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.lv:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.lvn{font:400 clamp(34px,8vw,46px)/1 var(--f-dis);color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.lvname{font:900 clamp(12px,3.2vw,15px)/1.2 var(--f-zh);background:#fff;border:3px solid var(--ink);border-radius:99px;padding:3px 8px;white-space:nowrap}
.lvstars{font:400 18px/1 var(--f-dis);letter-spacing:1px}
.lvstars i{font-style:normal;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.lvstars i.on{color:var(--gold)}
.lvmeta{font:700 12px/1 var(--f-zh);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.lv.locked{filter:grayscale(.85) brightness(.85);cursor:not-allowed}
.lv.fin .lvn{font-family:var(--f-zh);font-weight:900;font-size:clamp(22px,5.5vw,30px);color:var(--gold)}
.bigstars{display:flex;justify-content:center;gap:10px;margin:0 0 12px}
.bigstars i{font:400 clamp(50px,13vw,70px)/1 var(--f-dis);font-style:normal;color:#d9cfc4;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.bigstars i.on{color:var(--gold);animation:starpop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-50deg)}to{transform:scale(1) rotate(0)}}
.finale{padding-top:30px}
.fin-tag{position:absolute;top:-22px;left:50%;transform:translateX(-50%) rotate(-3deg);font:900 clamp(20px,5vw,26px)/1 var(--f-zh);color:#fff;background:linear-gradient(#ff86ad,var(--berry));border:4px solid var(--ink);border-radius:14px;padding:8px 22px;box-shadow:0 5px 0 var(--ink);letter-spacing:.2em;white-space:nowrap}
#finaleCv{width:100%;aspect-ratio:640/340;border:4px solid var(--ink);border-radius:18px;display:block;margin:0 0 12px;background:#2a2463}
.fin-story{font:700 clamp(14px,3.8vw,17px)/1.75 var(--f-zh);margin:0 auto 14px;max-width:34ch;text-wrap:pretty;white-space:pre-line}
.the-end{margin:0 0 14px;font:400 clamp(32px,8vw,44px)/1 var(--f-dis);letter-spacing:.12em;color:var(--gold);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
#chaseFill{position:absolute;inset:0 auto 0 0;width:0%;background:linear-gradient(90deg,#3fd0a0,#b6f27a);transition:width .2s}
@keyframes pulse{to{transform:scale(1.08)}}
.hud-r{display:flex;align-items:center;gap:8px}
#hearts{display:flex;gap:2px}
#hearts svg{width:32px;height:30px}
#hearts .empty path{fill:#c9bfb6}
#hearts .full{animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}}
@media (max-width:620px){ .hud-c{order:3;width:100%} }
#hint{position:absolute;left:0;right:0;bottom:calc(14% + 10px);text-align:center;pointer-events:none;font:900 clamp(17px,4.4vw,24px)/1.3 var(--f-zh);color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;animation:wob2 1s ease-in-out infinite alternate;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@keyframes wob2{to{transform:translateY(-6px)}}

/* over */
.kissbox{margin:4px auto 14px;display:flex;align-items:baseline;justify-content:center;gap:10px;font:900 clamp(22px,5.6vw,30px)/1 var(--f-zh)}
.kissbox strong{font:400 clamp(60px,16vw,96px)/1 var(--f-dis);color:var(--berry);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);font-variant-numeric:tabular-nums;display:inline-block}
.kissbox strong.bump{animation:bump .12s ease-out}
@keyframes bump{from{transform:scale(1.25)}to{transform:scale(1)}}
.ostats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 18px}
.ostats div{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 6px;box-shadow:0 4px 0 var(--ink)}
.ostats small{display:block;font:700 13px/1.3 var(--f-zh);color:var(--plum)}
.ostats b{font:400 26px/1.1 var(--f-dis);font-variant-numeric:tabular-nums}
.ostats .new{color:var(--berry-d)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.quote{font:700 15px/1.5 var(--f-zh);color:var(--plum);margin:0 0 6px}

/* select screen: phone & short-landscape layout */
.screen:not(#title){justify-content:flex-start}
.screen .panel{margin-block:auto}
.sel-info{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 12px;margin:0 0 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.sel-info .seg{margin:0}
.sel-info .sel-desc{margin:0}
.si-head,.si-stats{display:none}
.sel-actions{position:sticky;bottom:0;z-index:2;background:var(--cream);padding-block:10px 4px;margin-bottom:-4px}
@media (max-width:700px),(max-height:560px){
  #select .panel{padding:14px 12px}
  #select .panel h2{font-size:clamp(22px,6vw,28px);margin-bottom:8px}
  .card .tag,.card .stats{display:none}
  .card{padding:6px 6px 8px;gap:3px;border-radius:16px;box-shadow:0 4px 0 var(--ink)}
  .card.sel{transform:translateY(-3px);box-shadow:0 7px 0 var(--ink),0 0 0 3px var(--gold),0 0 18px 4px rgba(255,200,61,.7)}
  .card canvas{border-width:2px;border-radius:10px}
  .card .nm{font-size:clamp(15px,4.4vw,20px)}
  .cards{gap:8px;margin:2px 0 12px}
  .si-head{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:4px 10px}
  .si-head b{font:900 22px/1.1 var(--f-zh);letter-spacing:.04em}
  .si-head span{font:700 13px/1.3 var(--f-zh);color:var(--plum)}
  .si-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 14px;font:700 13px/1.4 var(--f-zh)}
  .si-stats b{color:var(--gold-d);letter-spacing:1px;font-weight:700}
  .seg{gap:10px}
  .seg button{font-size:16px;padding:12px 18px;border-radius:14px}
  .sel-desc{font-size:14px;line-height:1.55}
  .sel-actions .btn{font-size:clamp(17px,4.6vw,22px);padding:13px 22px 15px}
}
@media (max-height:560px) and (min-width:600px){
  .cards{grid-template-columns:repeat(6,1fr)!important}
  .card canvas{aspect-ratio:16/11}
  .sel-info{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:6px 16px;padding:8px 12px}
  .sel-info .sel-desc{flex-basis:100%;font-size:13px}
  .seg button{padding:9px 16px;font-size:15px}
  #select .panel h2{font-size:22px;margin-bottom:6px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <canvas id="game" aria-label="Kuma 遊戲畫面"></canvas>

  <div id="hud" hidden>
    <div class="hud-l">
      <div class="score" id="score">0</div>
      <div class="cans"><svg viewBox="0 0 24 26"><rect x="3" y="3" width="18" height="20" rx="3" fill="#dfe6ee" stroke="#2b1830" stroke-width="2.5"/><rect x="3" y="9" width="18" height="8" fill="#ff5d8f" stroke="#2b1830" stroke-width="2"/><ellipse cx="12" cy="4" rx="9" ry="2.6" fill="#fff" stroke="#2b1830" stroke-width="2"/></svg>×<span id="cans">0</span></div>
    </div>
    <div class="hud-c">
      <div class="pill" id="stagePill">STAGE 1・魔法森林</div>
      <div class="fever" id="prog"><div id="progFill"></div><b id="progLbl">終點 0m</b></div>
      <div class="fever" id="fever"><div id="feverFill"></div><b id="feverLbl">FEVER</b></div>
      <div class="fever" id="chase" hidden><div id="chaseFill"></div><b id="chaseLbl">距離 60m</b></div>
    </div>
    <div class="hud-r">
      <div id="hearts"></div>
      <button class="ibtn" id="muteBtn" aria-label="音效開關"></button>
      <button class="ibtn" id="pauseBtn" aria-label="暫停"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="2" fill="#2b1830"/><rect x="14" y="4" width="5" height="16" rx="2" fill="#2b1830"/></svg></button>
    </div>
  </div>
  <div id="hint" hidden>點一下跳躍・空中再點一下二段跳！</div>

  <section class="screen" id="title">
    <div class="logo-wrap">
      <i class="spark" style="left:-8%;top:6%;--s:30px"></i>
      <i class="spark" style="right:-6%;top:-4%;--s:22px;--d:.5s"></i>
      <i class="spark" style="right:4%;bottom:12%;--s:34px;--d:1s"></i>
      <i class="spark" style="left:6%;bottom:-6%;--s:18px;--d:.8s"></i>
      <div class="logo zh">愛貓<span>魔人</span></div>
      <div class="logo-sub">想親親貓咪<b>100</b>次</div>
    </div>
    <p class="tagline">五隻貓咪拼命逃，愛貓魔人要親遍全天下的貓咪！</p>
    <button class="btn gold" id="startBtn">開始冒險</button>
    <div class="mini" id="bestTitle">最高分 0</div>
  </section>

  <section class="screen" id="select" hidden>
    <div class="panel">
      <h2>選擇你的貓咪</h2>
      <div class="cards">
        <button class="card sel" id="cardKuma" aria-pressed="true">
          <canvas id="kumaPortrait" width="320" height="260"></canvas>
          <span class="nm">KUMA</span>
          <span class="tag">黑貓・胸口一撮白毛</span>
          <span class="stats"><span>跳躍</span><b>★★★★☆</b><span>速度</span><b>★★★★★</b><span>可愛</span><b>★★★★★</b></span>
        </button>
        <button class="card" id="cardChaser" aria-pressed="false">

/* ---------------- sound ---------------- */
const SND={ac:null,master:null,muted:false,
 on(){ if(this.ac){ if(this.ac.state==='suspended') this.ac.resume(); return; }
   try{ this.ac=new (window.AudioContext||window.webkitAudioContext)(); this.master=this.ac.createGain(); this.master.gain.value=this.muted?0:0.45; this.master.connect(this.ac.destination);}catch(e){this.ac=null} },
 tone(f,d,type='square',v=.12,slide=0,at){ if(!this.ac||this.muted) return; const t=at||this.ac.currentTime;
   const o=this.ac.createOscillator(), g=this.ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
   if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
   g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d); o.connect(g); g.connect(this.master); o.start(t); o.stop(t+d+.03); },
 noise(d,v=.2){ if(!this.ac||this.muted) return; const n=this.ac.sampleRate*d, b=this.ac.createBuffer(1,n,this.ac.sampleRate), a=b.getChannelData(0);
   for(let i=0;i<n;i++) a[i]=(Math.random()*2-1)*(1-i/n); const s=this.ac.createBufferSource(), g=this.ac.createGain(); s.buffer=b; g.gain.value=v; s.connect(g); g.connect(this.master); s.start(); },
 seq(notes,step,type,v){ if(!this.ac) return; const t=this.ac.currentTime; notes.forEach((f,i)=>this.tone(f,step*1.6,type,v,0,t+i*step)); },
 jump(){this.tone(380,.16,'square',.09,2.1)}, dj(){this.tone(560,.2,'triangle',.14,2.4)},
 can(){this.tone(1320,.07,'sine',.16); this.tone(1980,.12,'sine',.12,1,this.ac&&this.ac.currentTime+.05)},

 hit(){this.noise(.25,.25); this.tone(220,.35,'sawtooth',.16,.35)},

/* ---- BGM: 可愛輕快（I–vi–IV–V，音樂盒鐘琴 + 彈跳貝斯，138 BPM） ---- */
const mf=m=>440*Math.pow(2,(m-69)/12);
const CH=[[48,[72,76,79,84]],[45,[69,72,76,81]],[41,[65,69,72,77]],[43,[67,71,74,79]]];
const LEAD=[
 79,null,76,null, 79,81,79,76, 72,null,74,76, 79,null,null,null,
 81,null,79,null, 76,79,81,84, 81,null,79,76, 72,null,null,null,
 77,null,76,77, 81,null,79,77, 76,null,77,79, 84,null,81,null,
 79,null,77,76, 74,76,77,74, 71,null,74,null, 79,null,null,null];
const ARP=[0,2,1,3,2,1,3,2];
const bgm={next:0,step:0};
function bgmBus(){
  const ac=SND.ac;
  if(SND.bus) return SND.bus;
  const bus=ac.createGain(); bus.gain.value=.6; bus.connect(SND.master);
  const dl=ac.createDelay(1), fb=ac.createGain(), wet=ac.createGain();
  dl.delayTime.value=.22; fb.gain.value=.28; wet.gain.value=.3;
  dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(bus);
  const nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate), d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  SND.bus=bus; SND.delay=dl; SND.nbuf=nb; return bus;
}
function bVoice(type,f,t,dur,v,opt={}){
  const ac=SND.ac, o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(opt.detune) o.detune.value=opt.detune;
  let node=o;
  if(opt.lp){ const fl=ac.createBiquadFilter(); fl.type='lowpass'; fl.frequency.setValueAtTime(opt.lp,t); fl.frequency.exponentialRampToValueAtTime(Math.max(200,opt.lp*.35),t+dur); fl.Q.value=opt.q||6; o.connect(fl); node=fl; }
  node.connect(g);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  g.connect(SND.bus); if(opt.send) g.connect(SND.delay);
  o.start(t); o.stop(t+dur+.05);
}
function bNoise(t,dur,v,type,freq){
  const ac=SND.ac, s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=SND.nbuf; f.type=type; f.frequency.value=freq; s.connect(f); f.connect(g);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); g.connect(SND.bus); s.start(t,Math.random()*.5); s.stop(t+dur+.02);
}
function bKick(t,v){ const ac=SND.ac, o=ac.createOscillator(), g=ac.createGain(); o.type='sine';
  o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(42,t+.13);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.connect(g); g.connect(SND.bus); o.start(t); o.stop(t+.25); }
function bBell(f,t,v,dur){ bVoice('sine',f,t,dur,v,{send:true}); bVoice('sine',f*2,t,dur*.45,v*.35,{send:true}); bVoice('triangle',f,t,dur*.25,v*.5); }
function bgmTick(){
  if(!SND.ac||SND.muted) return;
  const m=G.mode;
  if(m==='pause'||m==='over'||m==='caught') { bgm.next=0; return; }
  const ac=SND.ac, bus=bgmBus(), inGame=m==='play', hot=inGame&&(G.feverT>0||G.rainbowT>0);
  const spb=60/(hot?158:138)/4;
  bus.gain.setTargetAtTime(inGame?.62:.4,ac.currentTime,.3);
  if(bgm.next<ac.currentTime) bgm.next=ac.currentTime+.06;
  while(bgm.next<ac.currentTime+.2){
    const t=bgm.next, s=bgm.step%64, st=s%16, bar=(s>>4), [root,tones]=CH[bar];
    // soft, bouncy percussion
    if(st===0||st===8||(inGame&&st===10)) bKick(t,.2);
    if(st===4||st===12) bNoise(t,.06,.1,'bandpass',2600);
    if(st%2===0) bNoise(t,.02,.03,'highpass',9500);
    if(st===14) bVoice('sine',1250,t,.05,.07);
    if(hot&&st%4===2) bVoice('sine',1600,t,.04,.05);
    // bouncy staccato bass: root – fifth – octave
    if(st===0||st===6||st===8||st===12){ const off={0:0,6:7,8:12,12:7}[st]; bVoice('triangle',mf(root+off),t,spb*1.3,.2); }
    // pizzicato arpeggio on 8ths
    if(st%2===0){ const an=tones[ARP[(st>>1)%8]]+(hot?12:0); bVoice('triangle',mf(an),t,spb*.9,.035,{send:true}); }
    // music-box melody
    const n=LEAD[s];
    if(n!==null&&(inGame||s<48)){ let len=1; while(len<4&&LEAD[(s+len)%64]===null) len++;
      bBell(mf(n+(hot?12:0)),t,.085,Math.max(.35,spb*len*1.6)); }
    // soft chord pad on bar starts
    if(st===0) tones.slice(0,3).forEach(tn=>bVoice('sine',mf(tn-12),t,spb*15,.025));
    bgm.next+=spb; bgm.step++;
  }
}

const hash=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x)};
function rr(x,y,w,h,r){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else { ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); } }
function fs(fill,lw=4){ if(fill){ctx.fillStyle=fill; ctx.fill();} if(lw){ctx.lineWidth=lw; ctx.strokeStyle=INK; ctx.lineJoin='round'; ctx.stroke();} }
const CJK=/[　-鿿＀-￯]/;
function otext(str,x,y,size,fill,lw){ ctx.font=CJK.test(str)?`900 ${size}px "Chiron GoRound TC","Noto Sans TC",sans-serif`:`${size}px "Lilita One","Chiron GoRound TC",sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round'; ctx.lineWidth=lw||size*.2; ctx.strokeStyle=INK; ctx.strokeText(str,x,y); ctx.fillStyle=fill; ctx.fillText(str,x,y); }
function star4(x,y,r,col){ ctx.beginPath(); for(let i=0;i<8;i++){ const a=i*Math.PI/4, rr2=i%2?r*.32:r; ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);} ctx.closePath(); ctx.fillStyle=col; ctx.fill(); }
function heartPath(x,y,s){ ctx.beginPath(); ctx.moveTo(x,y+s*.35); ctx.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.35); ctx.bezierCurveTo(x-s*.5,y+s*.65,x,y+s*.8,x,y+s); ctx.bezierCurveTo(x,y+s*.8,x+s*.5,y+s*.65,x+s*.5,y+s*.35); ctx.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.35); }

/* ---------------- Kuma ---------------- */
function drawKuma(x,y,sc,o={}){
  const t=G.t, run=o.run, air=o.air;
  ctx.save(); ctx.translate(x,y); ctx.scale(sc,sc);
  if(o.rot){ ctx.translate(6,-32); ctx.rotate(o.rot); ctx.translate(-6,32); }
  const ph=t*16, bob=run&&!air?-Math.abs(Math.sin(ph))*3:0;
  const legs=[[-13,Math.PI,1],[15,Math.PI,1],[-24,0,0],[26,0,0]];
  const wag=Math.sin(t*(run?10:3))*6;
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(let pass=0;pass<2;pass++){
    const out=pass===0;
    const part=(fn,fill,lw=4.5)=>{ fn(); if(out){ctx.strokeStyle='#fff'; ctx.lineWidth=13; ctx.stroke();} else fs(fill,lw); };
    // tail
    ctx.beginPath(); ctx.moveTo(-30,-30+bob); ctx.quadraticCurveTo(-60,-34+bob,-54,-64+wag+bob);
    if(out){ctx.strokeStyle='#fff'; ctx.lineWidth=22; ctx.stroke();} else {ctx.strokeStyle=INK; ctx.lineWidth=18; ctx.stroke(); ctx.strokeStyle=BODY; ctx.lineWidth=10; ctx.stroke();}
    // legs
    legs.forEach(([lx,off,far],i)=>{ ctx.save(); ctx.translate(lx,-16+bob);
      const a=air?(lx<0?.8:-.8):run?Math.sin(ph+off+(far?.5:0))*.75:0; ctx.rotate(a);
      part(()=>rr(-5.5,0,11,19,5.5), far?BODY_D:BODY, 4); ctx.restore(); });
    // body
    part(()=>{ctx.beginPath(); ctx.ellipse(0,-26+bob,34,16,0,0,TAU)}, BODY);
    // ears
    part(()=>{ctx.beginPath(); ctx.moveTo(17,-55+bob); ctx.lineTo(21,-76+bob); ctx.lineTo(32,-60+bob); ctx.closePath()}, BODY);
    part(()=>{ctx.beginPath(); ctx.moveTo(33,-60+bob); ctx.lineTo(44,-77+bob); ctx.lineTo(47,-54+bob); ctx.closePath()}, BODY);
    // head
    part(()=>{ctx.beginPath(); ctx.arc(32,-46+bob,18,0,TAU)}, BODY);
  }
  // inner ears
  ctx.fillStyle='#e58fa0';
  ctx.beginPath(); ctx.moveTo(21,-58+bob); ctx.lineTo(23,-70+bob); ctx.lineTo(29,-61+bob); ctx.fill();
  ctx.beginPath(); ctx.moveTo(36,-61+bob); ctx.lineTo(43,-71+bob); ctx.lineTo(44,-58+bob); ctx.fill();
  // rim light
  ctx.strokeStyle='#5d5674'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(-2,-28+bob,27,10,0,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
  ctx.beginPath(); ctx.arc(32,-46+bob,13,Math.PI*1.1,Math.PI*1.55); ctx.stroke();
  // white chest patch
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(38,-28+bob,6,5,.3,0,TAU); ctx.fill();
  // eyes
  const shock=o.shock;
  [[30,-47],[42,-46]].forEach(([ex,ey])=>{
    ctx.beginPath(); ctx.ellipse(ex,ey+bob,shock?6:4.6,shock?6.5:5.4,0,0,TAU); ctx.fillStyle='#d9c94b'; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle=INK; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(ex+.8,ey+bob,shock?1.4:1.6,shock?1.6:4.2,0,0,TAU); ctx.fillStyle='#0d0a10'; ctx.fill();
    ctx.beginPath(); ctx.arc(ex+2,ey-2.2+bob,1.3,0,TAU); ctx.fillStyle='#fff'; ctx.fill();
  });
  // nose & mouth
  ctx.fillStyle='#120e16'; ctx.beginPath(); ctx.moveTo(46.5,-41+bob); ctx.lineTo(50,-41+bob); ctx.lineTo(48.5,-38.5+bob); ctx.fill();
  ctx.strokeStyle='#8a7f92'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(48.5,-38.5+bob); ctx.quadraticCurveTo(47,-35.5+bob,44.5,-36.5+bob); ctx.stroke();
  // whiskers
  ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(46,-38+bob); ctx.lineTo(62,-42+bob); ctx.moveTo(46,-37+bob); ctx.lineTo(62,-35+bob); ctx.stroke();
  if(o.bite){
    ctx.strokeStyle='#8d86a0'; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(25,-55+bob); ctx.lineTo(33,-52+bob); ctx.moveTo(38,-52+bob); ctx.lineTo(46,-55+bob); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(43.5,-37.5+bob); ctx.lineTo(51,-37.5+bob); ctx.lineTo(47.5,-32.5+bob); ctx.closePath(); fs('#c25a6e',1.8);
    if(Math.sin(t*4)>.6) otext('呸！',66,-62+bob,15,'#a6e6ff',4);
    const sp=(t*2.2)%1;
    for(let i=0;i<4;i++){ const q=(sp+i*.25)%1, dx=52+q*72, dy=-37+bob-Math.sin(q*Math.PI)*16+q*12;
      ctx.save(); ctx.globalAlpha*=1-q*.7; ctx.beginPath(); ctx.arc(dx,dy,5.5-q*2,0,TAU); ctx.fillStyle='#a6e6ff'; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle=INK; ctx.stroke(); ctx.restore(); }
  }
  ctx.restore();
}

/* ---------------- 花花（緬因貓） ---------------- */
function drawHana(x,y,sc,o={}){
  const t=G.t, run=o.run, air=o.air;

  const legs=[[-14,Math.PI,1],[16,Math.PI,1],[-27,0,0],[28,0,0]];

  const ear2=()=>{ ctx.beginPath(); ctx.moveTo(36,-69+bob); ctx.lineTo(50,-90+bob); ctx.lineTo(53,-58+bob); ctx.closePath(); };
  const ruff=()=>{ ctx.beginPath(); ctx.ellipse(31,-34+bob,15,15,0,0,TAU); };
  const legAng=(lx,off,far)=>air?(lx<0?.8:-.8):run?Math.sin(ph+off+(far?.5:0))*.75:0;
  // white sticker outline
  tail(); ctx.strokeStyle='#fff'; ctx.lineWidth=40; ctx.stroke();
  legs.forEach(([lx,off,far])=>{ ctx.save(); ctx.translate(lx,-17+bob); ctx.rotate(legAng(lx,off,far)); rr(-6,0,12,21,6); ctx.strokeStyle='#fff'; ctx.lineWidth=13; ctx.stroke(); ctx.restore(); });
  [body,ruff,ear1,ear2,head].forEach(f=>{ f(); ctx.strokeStyle='#fff'; ctx.lineWidth=13; ctx.stroke(); });

  // legs with white socks
  legs.forEach(([lx,off,far])=>{ ctx.save(); ctx.translate(lx,-17+bob); ctx.rotate(legAng(lx,off,far));
    rr(-6,0,12,21,6); fs(far?'#1f1a1e':DK,4); rr(-6.5,12,13,9,4.5); fs(WH,3); ctx.restore(); });
  // body with calico patches
  body(); fs(DK,0);
  ctx.save(); body(); ctx.clip();
  ctx.fillStyle=TAN; ctx.beginPath(); ctx.ellipse(-14,-40+bob,20,10,.3,0,TAU); ctx.ellipse(16,-22+bob,14,8,-.2,0,TAU); ctx.fill();
  ctx.fillStyle=ORA; ctx.beginPath(); ctx.ellipse(-2,-45+bob,13,6,0,0,TAU); ctx.ellipse(-30,-26+bob,9,7,0,0,TAU); ctx.fill();
  ctx.restore(); body(); fs(null,4.5);
  // mane + white chest
  ruff(); fs(TAN,4); ctx.beginPath(); ctx.ellipse(38,-30+bob,9,10,0,0,TAU); ctx.fillStyle=WH; ctx.fill();
  // ears with lynx tufts
  ear1(); fs(TAN,4.5); ear2(); fs(DK,4.5);
  ctx.fillStyle='#e9a0a8'; ctx.beginPath(); ctx.moveTo(21,-66+bob); ctx.lineTo(21,-81+bob); ctx.lineTo(29,-68+bob); ctx.fill();
  ctx.fillStyle='#8a4a52'; ctx.beginPath(); ctx.moveTo(40,-69+bob); ctx.lineTo(48,-82+bob); ctx.lineTo(49,-63+bob); ctx.fill();
  [[19,-89,16,-102],[50,-90,54,-103]].forEach(([a,b,c2,d])=>{ ctx.beginPath(); ctx.moveTo(a,b+bob); ctx.lineTo(c2,d+bob); ctx.strokeStyle=INK; ctx.lineWidth=5; ctx.stroke(); ctx.strokeStyle=ORA; ctx.lineWidth=2.5; ctx.stroke(); });
  // head: half tabby, half black
  head(); fs(TAN,0);
  ctx.save(); head(); ctx.clip();
  ctx.fillStyle=DK; ctx.beginPath(); ctx.moveTo(37,-76+bob); ctx.lineTo(62,-76+bob); ctx.lineTo(62,-24+bob); ctx.lineTo(40,-24+bob); ctx.quadraticCurveTo(34,-50+bob,37,-76+bob); ctx.fill();
  ctx.strokeStyle='#8a6440'; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(24,-68+bob); ctx.lineTo(27,-62+bob); ctx.moveTo(30,-70+bob); ctx.lineTo(31,-63+bob); ctx.moveTo(17,-56+bob); ctx.lineTo(22,-54+bob); ctx.stroke();
  ctx.fillStyle=WH; ctx.beginPath(); ctx.ellipse(46,-38+bob,9,6.5,.2,0,TAU); ctx.fill();
  ctx.restore(); head(); fs(null,4.5);
  // eyes

    ctx.beginPath(); ctx.ellipse(ex,ey+bob,shock?6:4.8,shock?6.5:5.4,0,0,TAU); ctx.fillStyle='#cdd36c'; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle=INK; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(ex+.8,ey+bob,shock?1.4:1.6,shock?1.6:4.2,0,0,TAU); ctx.fillStyle='#0d0a10'; ctx.fill();
    ctx.beginPath(); ctx.arc(ex+2,ey-2.2+bob,1.3,0,TAU); ctx.fillStyle='#fff'; ctx.fill();
  });
  if(o.bite){ ctx.strokeStyle=INK; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(24,-62+bob); ctx.lineTo(33,-59+bob); ctx.moveTo(39,-59+bob); ctx.lineTo(47,-61+bob); ctx.stroke(); }
  // nose
  ctx.beginPath(); ctx.moveTo(49.5,-45+bob); ctx.lineTo(54,-45+bob); ctx.lineTo(52,-42+bob); ctx.closePath(); fs('#e79a95',1.5);

    ctx.beginPath(); ctx.moveTo(44,-39.5+bob); ctx.lineTo(54,-39.5+bob); ctx.lineTo(50,-32+bob); ctx.closePath(); fs('#8a2a3a',2);
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(45.5,-39.5+bob); ctx.lineTo(48,-39.5+bob); ctx.lineTo(46.8,-35.5+bob); ctx.moveTo(50.5,-39.5+bob); ctx.lineTo(53,-39.5+bob); ctx.lineTo(51.6,-35.5+bob); ctx.fill();
  } else { ctx.strokeStyle='#8a7f92'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(52,-42+bob); ctx.quadraticCurveTo(50,-38.5+bob,47,-39.5+bob); ctx.stroke(); }
  // long whiskers
  ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(48,-41+bob); ctx.lineTo(72,-47+bob); ctx.moveTo(48,-40+bob); ctx.lineTo(74,-39+bob); ctx.moveTo(48,-39+bob); ctx.lineTo(70,-32+bob); ctx.stroke();

/* ---------------- 石內卜（黑白緬因貓） ---------------- */

  const t=G.t, run=o.run, air=o.air, atk=o.bite;

  const swipe=atk?Math.pow(Math.max(0,Math.sin(t*7)),3):0;

  const ear2=()=>{ ctx.beginPath(); ctx.moveTo(36,-69+bob); ctx.lineTo(51,-91+bob); ctx.lineTo(54,-58+bob); ctx.closePath(); };
  const ruff=()=>{ ctx.beginPath(); ctx.ellipse(32,-33+bob,16,16,0,0,TAU); };
  const legAng=(lx,off,far)=>{
    let a=air?(lx<0?.8:-.8):run?Math.sin(ph+off+(far?.5:0))*.75:0;
    if(atk&&lx===28) a=a*(1-swipe)-1.9*swipe;

  legs.forEach(([lx,off,far])=>{ ctx.save(); ctx.translate(lx,-17+bob); ctx.rotate(legAng(lx,off,far)); rr(-6,0,12,21,6); ctx.strokeStyle='#fff'; ctx.lineWidth=13; ctx.stroke(); ctx.restore(); });
  [body,ruff,ear1,ear2,head].forEach(f=>{ f(); ctx.strokeStyle='#fff'; ctx.lineWidth=13; ctx.stroke(); });

  tail(); ctx.setLineDash([5,11]); ctx.strokeStyle='#3a343c'; ctx.lineWidth=14; ctx.stroke(); ctx.setLineDash([]);
  // legs with white socks
  legs.forEach(([lx,off,far])=>{ ctx.save(); ctx.translate(lx,-17+bob); ctx.rotate(legAng(lx,off,far));
    rr(-6,0,12,21,6); fs(far?DK2:DK,4); rr(-6.5,10,13,11,5); fs(WH,3); ctx.restore(); });
  // body

  ctx.beginPath(); ctx.moveTo(-22,-22+bob); ctx.lineTo(-17,-26+bob); ctx.moveTo(-8,-18+bob); ctx.lineTo(-3,-23+bob); ctx.stroke();
  // white bib

  ctx.strokeStyle='#d9d2cc'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(26,-26+bob); ctx.lineTo(29,-21+bob); ctx.moveTo(33,-24+bob); ctx.lineTo(35,-19+bob); ctx.stroke();
  // ears with long tufts
  ear1(); fs(DK,4.5); ear2(); fs(DK,4.5);
  ctx.fillStyle='#5a3e48'; ctx.beginPath(); ctx.moveTo(20,-66+bob); ctx.lineTo(20,-82+bob); ctx.lineTo(29,-68+bob); ctx.fill();
  ctx.beginPath(); ctx.moveTo(40,-69+bob); ctx.lineTo(49,-83+bob); ctx.lineTo(50,-63+bob); ctx.fill();
  [[18,-90,14,-106],[51,-91,56,-107]].forEach(([a,b,c2,d])=>{ ctx.beginPath(); ctx.moveTo(a,b+bob); ctx.lineTo(c2,d+bob); ctx.strokeStyle=INK; ctx.lineWidth=5.5; ctx.stroke(); ctx.strokeStyle='#8a8590'; ctx.lineWidth=2.5; ctx.stroke(); });
  // head

  ctx.fillStyle=WH; ctx.beginPath(); ctx.ellipse(46,-40+bob,9,5.2,.12,0,TAU); ctx.ellipse(53,-40+bob,4.6,3.6,0,0,TAU); ctx.fill();
  ctx.fillStyle=DK; ctx.beginPath(); ctx.ellipse(47,-34.6+bob,5,2.8,0,0,TAU); ctx.fill();
  // eyes: half-lidded grump, or glare when attacking
  [[29,-53],[43,-52]].forEach(([ex,ey])=>{
    ctx.beginPath(); ctx.ellipse(ex,ey+bob,5,5.4,0,0,TAU); ctx.fillStyle='#d6d46a'; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle=INK; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(ex+.8,ey+bob,1.5,4.2,0,0,TAU); ctx.fillStyle='#0d0a10'; ctx.fill();
    ctx.beginPath(); ctx.arc(ex+2,ey-2+bob,1.2,0,TAU); ctx.fillStyle='#fff'; ctx.fill();

      ctx.beginPath(); ctx.moveTo(ex-5.5,ey+(atk?-1.5:0)+bob); ctx.lineTo(ex+5.5,ey+(atk?-3:-.6)+bob); ctx.strokeStyle='#bfb8c4'; ctx.lineWidth=1.8; ctx.stroke(); }
  });
  if(atk){ ctx.strokeStyle='#cfc8d4'; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(23,-62+bob); ctx.lineTo(33,-58+bob); ctx.moveTo(38,-58+bob); ctx.lineTo(48,-61+bob); ctx.stroke(); }
  // nose
  ctx.beginPath(); ctx.moveTo(49.5,-45+bob); ctx.lineTo(54.5,-45+bob); ctx.lineTo(52,-41.5+bob); ctx.closePath(); ctx.fillStyle='#0e0b10'; ctx.fill();

    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(45.5,-38.5+bob); ctx.lineTo(48,-38.5+bob); ctx.lineTo(46.8,-34.5+bob); ctx.moveTo(51,-38.5+bob); ctx.lineTo(53.5,-38.5+bob); ctx.lineTo(52.2,-34.5+bob); ctx.fill();
  } else { ctx.strokeStyle='#5a5560'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(45,-36.2+bob); ctx.quadraticCurveTo(49.5,-39.2+bob,54,-36.2+bob); ctx.stroke(); }

  // claw swipe
  if(swipe>.5){ ctx.globalAlpha*=swipe; ctx.strokeStyle='#fff'; ctx.lineWidth=3; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(64,-46+i*8+bob,11,-.9,.9); ctx.stroke(); } }
  ctx.restore();
}

/* ---------------- 六六（曼赤肯貓・短腿鬥雞眼） ---------------- */

/* ---------------- spawning ---------------- */
function addObs(type,x){
  const d={crate:[50,54],stack:[50,104],cuke:[70,28],hedge:[78,44],mouse:[104,62]}[type];
  G.ents.push({type,x,w:d[0],h:d[1],vx:type==='mouse'?150:0,hop:type==='mouse'&&G.stage>0&&Math.random()<.4,hopT:.5,jy:0,jvy:0});
}
function addCan(x,h,gold){ G.ents.push({type:'can',x,y:GY-30-h,gold:!!gold,ph:Math.random()*6}); }
function pickObs(simple){ const l=['crate','cuke','hedge']; if(G.stage>=1&&!simple) l.push('stack'); return pick(l); }
function spawn(){
  const X=W+120, r=Math.random(), sf=G.speed/330; let gap;
  if(G.dist+(X-KX)>G.LEN-260){ G.spawnIn=120; return; }
  if(G.rainbowT>.8){ for(let i=0;i<10;i++){ G.waveI++; addCan(X+i*54,70+Math.sin(G.waveI*.55)*60,i%4===3); } gap=560; }
  else if(r<.3){ const t=pickObs(); addObs(t,X); const pk=t==='stack'?185:125; addCan(X-75,pk*.55); addCan(X,pk); addCan(X+75,pk*.55); gap=rand(430,600); }
  else if(r<.46&&G.runT>5){ addObs('mouse',X); addCan(X,150,Math.random()<.3); gap=rand(600,760); }
  else if(r<.66){ for(let i=0;i<5;i++) addCan(X+i*52,0,i===4&&Math.random()<.4); gap=rand(300,420); }
  else if(r<.8&&G.runT>9){ addObs(pickObs(true),X); addObs(pickObs(true),X+.7*G.speed+120); gap=rand(620,760); }
  else if(r<.9&&G.giantT<=0&&G.runT-G.lastFish>13){ G.lastFish=G.runT; G.ents.push({type:'fish',x:X,y:GY-30-115,ph:0}); addCan(X-64,90); addCan(X+64,90); gap=420; }
  else { for(let i=0;i<4;i++) addCan(X+i*52,205,i===3); addObs('hedge',X+78); gap=600; }
  G.spawnIn=gap*(.85+sf*.2);
}

/* ---------------- update ---------------- */
function update(dt){
  G.t+=dt;
  const k=G.kuma, play=G.mode==='play';
  if(G.mode==='pause') return;
  if(play){
    G.runT+=dt; G.stageT+=dt;
    let sp=Math.min(720,330+G.level*35+G.runT*1.6); if(G.rainbowT>0) sp*=1.35;
    G.speed+=(sp-G.speed)*Math.min(1,dt*3);
    if(isChaseHero(G.hero)){ let dd=1.25+G.stage*.15; if(G.feverT>0) dd=-3.5; if(G.rainbowT>0) dd=-5; G.D=Math.max(0,Math.min(100,G.D+dd*dt)); }
  } else if(G.mode==='caught'||G.mode==='over'){ G.speed*=Math.pow(.03,dt); }
  else { G.speed=260; G.attractT+=dt; if(G.attractT>7){ G.attractT=0; G.prevStage=G.stage; G.stage=(G.stage+1)%STAGES.length; G.stageFade=1; } }
  G.scroll+=G.speed*dt;
  G.invuln=Math.max(0,G.invuln-dt); G.shake=Math.max(0,G.shake-dt*40); G.flash=Math.max(0,G.flash-dt*1.5);
  G.stageFade=Math.max(0,G.stageFade-dt*.9);
  if(G.feverT>0){ G.feverT-=dt; if(G.feverT<=0) G.feverT=0; }
  if(G.rainbowT>0) G.rainbowT=Math.max(0,G.rainbowT-dt);
  if(G.giantT>0){ G.giantT-=dt; if(G.giantT<=0){ G.giantT=0; burst(KX,GY-40,12,'star',['#7ff0ff','#fff'],260);} }
  if(G.banner){ G.banner.t+=dt; if(G.banner.t>G.banner.dur) G.banner=null; }

  // kuma
  if(G.mode!=='caught'&&G.mode!=='over'){
    k.vy+=2400*dt; k.y+=k.vy*dt;
    if(k.y>=0){ if(!k.ground&&play) burst(KX,GY,4,'dot',['#fff'],100); k.y=0; k.vy=0; k.jumps=0; k.ground=true; }
  } else { k.vy+=2400*dt; k.y=Math.min(0,k.y+k.vy*dt); if(k.y>=0){k.y=0;k.vy=0} }
  if(k.spin>0) k.spin=Math.max(0,k.spin-dt*2.8);
  k.sc+=((G.giantT>0?(G.hero==='chaser'?1.55:1.9):(G.hero.startsWith('liuliu')?1.3:G.hero.startsWith('kuma')?1:baseCat(G.hero)?1.12:1))-k.sc)*Math.min(1,dt*6);
  if(G.mode==='title'||G.mode==='select'||G.mode==='levels'||G.mode==='finale'){ G.autoJ-=dt; if(G.autoJ<=0){ jump(); if(Math.random()<.4) setTimeout(jump,260); G.autoJ=rand(1.4,3); } }

  if(play){
    const ch=isChaseHero(G.hero), tall=G.hero==='chaser', bite=catChase();
    G.dist+=G.speed*dt;
    if(!G.goalWarn&&G.LEN-G.dist<W*1.4){ G.goalWarn=true; say(ch?(bite?`終點快到了！別被${atkVerb()}到啊～`:`終點快到了！${nm()} 別跑～`):'可惡！終點快到了！',2.2); }
    if(!G.cpDone&&G.dist>=G.LEN/2){
      G.cpDone=true; G.rainbowT=5.5;
      G.ents.forEach(e=>{ if(e.type!=='can'&&e.type!=='fish'&&e.x>KX+40){ e.type='can'; e.gold=true; e.y=GY-30-60; e.ph=0; } });
      banner('RAINBOW FEVER!','CHECKPOINT・已經跑一半了',2.6); SND.stage(); say(ch?'彩虹熱！全速衝刺！':'彩虹熱！等等我～',2.4);
      burst(KX,GY-60,30,'star',['#ff4f6d','#ffd84a','#5ed67a','#4fb6ff','#b66bff'],420);
    }
    G.spawnIn-=G.speed*dt; if(G.spawnIn<=0) spawn();
    const mult=(G.feverT>0?3:1)*(G.rainbowT>0?2:1);
    G.score+=G.speed*dt*.03*mult;
    const sc=k.sc, feet=GY+k.y, kcy=feet-(tall?75:30)*sc;
    const kb=tall?{l:KX-22*sc,r:KX+44*sc,t:feet-150*sc,b:feet-4}:{l:KX-24*sc,r:KX+40*sc,t:feet-56*sc,b:feet-4};
    for(const e of G.ents){
      if(e.flying){ e.x+=e.vx*dt; e.fy+=e.vy*dt; e.vy+=1800*dt; e.rot+=e.vr*dt; continue; }
      e.x-=G.speed*dt+(e.vx||0)*dt;
      if(e.type==='can'||e.type==='fish'){
        if((G.feverT>0||G.rainbowT>0||G.giantT>0)&&e.type==='can'){ const dx=KX+10-e.x, dy=kcy-e.y; if(Math.hypot(dx,dy)<270){ e.x+=dx*Math.min(1,dt*9); e.y+=dy*Math.min(1,dt*9); } }
        if(Math.hypot(KX+10-e.x,kcy-e.y)<(tall?46:32)*sc+18){
          e.dead=true;
          if(e.type==='fish'){ G.giantT=7; SND.grow(); G.shake=12; banner('巨大化！','撞飛所有障礙物',1.8); say(tall?'愛貓魔人巨大化！':`哇！${nm()}變大了！`,2); burst(e.x,e.y,22,'star',['#7ff0ff','#fff','#ffc83d'],360); continue; }
          const pts=(e.gold?50:10)*mult; G.score+=pts; G.cans++; G.canBank++; if(ch) G.D=Math.max(0,G.D-(e.gold?5:1.5));
          pop(e.x,e.y-20,'+'+pts,e.gold?'#ffc83d':'#fff');
          if(e.gold) SND.gold(); else SND.can();
          burst(e.x,e.y,e.gold?12:6,'star',e.gold?['#ffd34d','#fff','#ff9a3c']:['#fff','#ffe9a0'],220);
          if(G.feverT<=0){ G.meter+=e.gold?.14:.04; if(G.meter>=1){ G.meter=0; G.feverT=8; SND.fever(); banner('FEVER ×3!','罐頭分數三倍',1.8); G.shake=8; } }
          if(G.canBank>=40){ G.canBank=0; if(G.hearts<3){ G.hearts++; renderHearts(); SND.heal(); pop(KX,feet-90*sc,'♥ +1','#ff5d8f'); say(ch?'元氣恢復！繼續追！':'可惡～又被牠逃掉了！',2);} }
        }

        burst(G.ai.x,GY-40,30,'heart',['#ff5d8f','#ff8fb0'],300); }

      if(end&&!G.endWin) otext('…',KX+40,feet-110,40,'#fff',8);
    } else {
    drawCatT(heroCat(),a.x,GY+a.y,heroCat()==='kuma'?1:heroCat()==='liuliu'?1.3:1.1,{run:!win,air:!a.ground,shock:win});
    if(win) otext('！',a.x+40,GY-96,40,'#ff5d8f',8);

  fcx.beginPath(); fcx.arc(283,23,13,0,TAU); fcx.fillStyle='#262061'; fcx.fill();
  const towers=[[34,66,24],[86,92,32],[160,112,42],[234,92,32],[286,66,24]];
  towers.forEach(([cx,th,tw])=>{ fcx.fillStyle='#3b2f6b'; fcx.fillRect(cx-tw/2,gy-th,tw,th); fcx.beginPath(); fcx.moveTo(cx-tw/2-4,gy-th); fcx.lineTo(cx,gy-th-28); fcx.lineTo(cx+tw/2+4,gy-th); fcx.fill();
    fcx.fillStyle='#ffd34d'; rr(cx-4,gy-th+14,8,11,4); fcx.fill(); });
  rr(126,gy-112-2,68,20,6); fcx.fillStyle='#fff4df'; fcx.fill(); fcx.lineWidth=2.5; fcx.strokeStyle=INK; fcx.stroke();
  fcx.font='900 12px "Chiron GoRound TC","Noto Sans TC",sans-serif'; fcx.textAlign='center'; fcx.textBaseline='middle'; fcx.fillStyle='#d63a6c'; fcx.fillText('FUFU城堡',160,gy-104);
  fwT-=dt;
  if(fwT<=0){ fwT=rand(.35,.8); const x=rand(30,290), y=rand(16,64), col=pick(['#ff4f6d','#ffd84a','#5ed67a','#4fb6ff','#ff8fb0','#fff']);
    for(let i=0;i<20;i++){ const a=i/20*TAU, v=rand(22,50); FP.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:1.1,col}); } }
  for(let i=FP.length-1;i>=0;i--){ const p=FP[i]; p.life+=dt; if(p.life>p.max){ FP.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=30*dt; fcx.globalAlpha=1-p.life/p.max; star4(p.x,p.y,2.6,p.col); }
  fcx.globalAlpha=1;
  fcx.fillStyle='#5b4a8a'; fcx.fillRect(0,gy,w,h-gy);
  fcx.beginPath(); fcx.moveTo(0,gy); fcx.lineTo(w,gy); fcx.lineWidth=3; fcx.strokeStyle=INK; fcx.stroke();
  for(let i=0;i<6;i++){ const q=((G.t*.35)+i/6)%1; fcx.globalAlpha=1-q; heartPath(118+hash(i+3)*90,gy-46-q*90,6+q*5); fcx.fillStyle='#ff8fb0'; fcx.fill(); }
  fcx.globalAlpha=1;
  drawSnape(94,gy-4,.56,{run:false,bite:G.hero==='snapeHit'});
  drawKuma(38,gy,.6,{run:false,bite:G.hero==='kumaSpit'});
  drawChaser(160,gy,.52,{run:false,happy:true});
  fcx.save(); fcx.translate(280,gy); fcx.scale(-1,1); drawHana(0,0,.62,{run:false,bite:G.hero==='hanaBite'}); fcx.restore();
  fcx.save(); fcx.translate(222,gy); fcx.scale(-1,1); drawLiuliu(0,0,.72,{run:false,bite:G.hero==='liuliuHit'}); fcx.restore();
  fcx.save(); fcx.translate(244,gy+20); fcx.scale(-1,1); drawLanlan(0,0,.5,{run:false,bite:G.hero==='lanlanMilk'}); fcx.restore();
  ctx=old;
}

/* ---------------- input ---------------- */
function onPress(e){
  if(e.target.closest&&e.target.closest('button')) return;
  if(G.mode==='play'){ e.preventDefault(); jump(); }
}
app.addEventListener('pointerdown',onPress);
window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)){ e.preventDefault(); if(G.mode==='play') jump(); else if(G.mode==='title') toSelect(); else if(G.mode==='select') toLevels(); else if(G.mode==='pause') resumeGame(); }
  if(e.code==='KeyP'||e.code==='Escape'){ G.mode==='play'?pauseGame():resumeGame(); }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseGame(); });
function toSelect(){ SND.on(); G.mode='select'; show(ui.select); }
$('#startBtn').onclick=toSelect;
$('#backBtn').onclick=()=>{ G.mode='title'; show(ui.title); };
const DESC={
  lanlan:'被追模式：你是波斯貓藍藍香！頂著紅色小頭冠和一身大蓬毛，邊跑邊收罐頭，才不給愛貓魔人親！',
  lanlanMilk:'逼泡奶模式：換藍藍香追愛貓魔人！收集罐頭縮短距離，追到 0m 就逼他泡 100 杯羊奶！',kumaSpit:'追吐模式：換 Kuma 追愛貓魔人！收集罐頭縮短距離，追到 0m 就對他「呸」100 次口水！',
  kuma:'被追模式：你是 Kuma！點擊跳躍、空中再點二段跳。收集罐頭集滿 FEVER，吃到發光小魚乾會變巨大，別被愛貓魔人抓到！',
  chaser:'愛貓魔人的目標：追到全天下的貓咪，每隻都親親 100 次！每關要追的貓咪不一樣（五關分別是 Kuma、花花、石內卜、六六、藍藍香）。收集罐頭縮短距離，在終點前追到牠！',
  snape:'被追模式：你是緬因貓石內卜！一路臭著臉跳躍、收集罐頭，絕對不給愛貓魔人親！',
  snapeHit:'追打模式：換石內卜追愛貓魔人！收集罐頭縮短距離，追到 0m 就賞他 100 記貓拳！',
  liuliu:'被追模式：你是曼赤肯貓六六！腿短但跑很快，鬥雞眼盯緊罐頭，別被愛貓魔人親到！',
  liuliuHit:'追打模式：換六六追愛貓魔人！收集罐頭縮短距離，追到 0m 就用短腿貓拳打他 100 下！',
  hana:'被追模式：你是緬因貓花花！跳躍收集罐頭、閃避障礙，別被想親親的愛貓魔人抓到！',
  hanaBite:'追咬模式：換花花追愛貓魔人！收集罐頭縮短距離，追到 0m 就能狠狠咬他 100 口！'};
function pickHero(h){ G.hero=h; const map={kuma:'#cardKuma',kumaSpit:'#cardKuma',chaser:'#cardChaser',hana:'#cardHana',hanaBite:'#cardHana',snape:'#cardSnape',snapeHit:'#cardSnape',liuliu:'#cardLiuliu',liuliuHit:'#cardLiuliu',lanlan:'#cardLanlan',lanlanMilk:'#cardLanlan'};
  ['#cardKuma','#cardChaser','#cardHana','#cardSnape','#cardLiuliu','#cardLanlan'].forEach(s=>{ const on=map[h]===s, el=$(s); el.classList.toggle('sel',on); el.setAttribute('aria-pressed',String(on)); });
  const bc=baseCat(h), seg=$('#hanaSeg'); seg.hidden=!bc;
  if(bc){ const [rb,cb]=seg.querySelectorAll('button'); cb.textContent=bc==='hana'?'追咬模式':bc==='kuma'?'追吐模式':bc==='lanlan'?'逼泡奶模式':'追打模式'; rb.classList.toggle('on',h===bc); cb.classList.toggle('on',h!==bc); }
  $('#selDesc').textContent=DESC[h];
  const card=$(map[h]); $('#siName').textContent=card.querySelector('.nm').textContent; $('#siTag').textContent=card.querySelector('.tag').textContent;
  const st=[...card.querySelectorAll('.stats > *')]; let html=''; for(let i=0;i+1<st.length;i+=2) html+=`<span>${st[i].textContent} <b>${st[i+1].textContent}</b></span>`; $('#siStats').innerHTML=html; }
$('#cardHana').onclick=()=>{ SND.on(); SND.can(); pickHero(baseCat(G.hero)==='hana'?G.hero:'hana'); };
$('#cardSnape').onclick=()=>{ SND.on(); SND.can(); pickHero(baseCat(G.hero)==='snape'?G.hero:'snape'); };
$('#cardLiuliu').onclick=()=>{ SND.on(); SND.can(); pickHero(baseCat(G.hero)==='liuliu'?G.hero:'liuliu'); };
$('#cardLanlan').onclick=()=>{ SND.on(); SND.can(); pickHero(baseCat(G.hero)==='lanlan'?G.hero:'lanlan'); };
document.querySelectorAll('#hanaSeg button').forEach(b=>{ b.onclick=()=>{ const bc=baseCat(G.hero); if(!bc) return; SND.on(); SND.can(); pickHero(b.dataset.r==='run'?bc:CHASE_ID[bc]); }; });
pickHero('kuma');
$('#cardKuma').onclick=()=>{ SND.on(); SND.can(); pickHero(baseCat(G.hero)==='kuma'?G.hero:'kuma'); };
$('#cardChaser').onclick=()=>{ SND.on(); SND.can(); pickHero('chaser'); };
$('#goBtn').onclick=toLevels;
$('#lvBack').onclick=toSelect;
$('#cLevels').onclick=toLevels;
$('#cNext').onclick=()=>{ if(G.level>=STAGES.length-1) showFinale(); else startGame(G.level+1); };
$('#fLevels').onclick=toLevels;
$('#fHome').onclick=toTitle;
$('#pauseBtn').onclick=pauseGame;
$('#resumeBtn').onclick=resumeGame;
$('#restartBtn').onclick=startGame;
$('#homeBtn').onclick=toTitle;
$('#againBtn').onclick=startGame;
$('#menuBtn').onclick=toLevels;
ui.mute.onclick=()=>{ SND.on(); SND.muted=!SND.muted; if(SND.master) SND.master.gain.value=SND.muted?0:.45; renderMute(); };
$('#bestTitle').textContent='最高分 '+best.toLocaleString();
document.querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',()=>{ if(b!==ui.mute) SND.on(); }));

/* ---------------- loop ---------------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000); last=now;
  update(dt); draw(); bgmTick();
  if(!ui.select.hidden) drawPortrait();
  if(!ui.finale.hidden) drawFinale(dt);
  requestAnimationFrame(loop);
}
G.chaser.x=KX-200;
requestAnimationFrame(loop);
})();
</script>
